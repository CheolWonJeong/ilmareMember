	<script>
	document.addEventListener('DOMContentLoaded', function() {
	    // 현재 URL의 path만 추출 (쿼리스트링, 해시 제외)
	    var currentPath = window.location.pathname;

	    // 모든 사이드 메뉴의 a 태그를 선택
	    var menuLinks = document.querySelectorAll('.side-lnb a');

	    menuLinks.forEach(function(link) {
	        // 메뉴의 href 속성값
	        var linkPath = link.getAttribute('href');

	        // 현재 경로와 메뉴의 href가 일치하면 active 클래스 추가
	        if (linkPath === currentPath) {
	            // 기존에 active가 있으면 제거 (중복 방지)
	            menuLinks.forEach(function(l) { l.classList.remove('active'); });
	            link.classList.add('active');
	            
	            // 상위 li에 open 클래스도 추가 (서브메뉴 펼침용)
	            var parentLi = link.closest('li');
	            if (parentLi) {
	                parentLi.classList.add('open');
	            }
	        }
	    });
	});
	</script>
