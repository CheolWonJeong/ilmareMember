<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{adm/layout/admlayour}">
	<th:block layout:fragment="head" th:insert="~{@{/adm/layout/admhead}}"></th:block>

<script type="text/javascript">
	$(function(){ 
	});

	$(document).ready(function(){
    	
		// 검색 버튼 클릭
	    $('#searchBtn').on('click', function() {
			
	        searchNews(1);
	    });

	    // 엔터키로 검색
	    $('#searchValue').on('keydown', function(event) {
			//alert("enter");
	        if (event.keyCode === 13) {
	            searchNews(1);
	        }
	    });

	    // 최초 로딩 시 1페이지 검색
	    //searchNews(1);

	    function searchNews(pageIdx) {
			alert("searchNews pageIdx " + pageIdx);
	        var rowPerPage = 10;
	        var param = {
				"searchType" : "TITLE",
	            "searchValue" : $('#searchValue').val(),
	            "pageNo" : pageIdx
	        };

	        $.ajax({
	            url : '/adm/content/HotNewsQueryList',
	            type : 'POST',
	            dataType : 'JSON',
	            cache : false,
	            data : param,
	            success : function(data) {
	                var values = data.rows;
	                var strHtml = "";

	                if (values && values.length > 0) {
	                    $.each(values, function(index, value){
							
							// 상태값 변환
							var statText = '';
							if (value.docStat === 'N') statText = '등록';
							else if (value.docStat === 'V') statText = '게시';
							else if (value.docStat === 'C') statText = '게시취소';
							else if (value.docStat === 'D') statText = '삭제';
							else statText = '';
														
	                        strHtml += '<tr id="' + value.docSeq + '">';
	                        strHtml += '    <td>' + value.docTitle + '</td>';
	                        strHtml += '    <td>' + value.docFrom + '</td>';
	                        strHtml += '    <td>' + statText + '</td>';
	                        strHtml += '    <td>' + value.regDtm + '</td>';
	                        strHtml += '</tr>';
	                    });
	                } else {
	                    strHtml = '<tr><td colspan="4" class="no_result"><span>검색 결과가 없습니다.</span></td></tr>';
	                }
	                $('#boardTbody1').html(strHtml);
	            },
	            error : function() {
	                alert('서비스 장애발생 관리자에게 문의해 주십시요');
	            }
	        });
	    }
        
        $('#insertBtn').on('click',function(){
            location.href = "/adm/content/HotNewsIns.do";
        });
		
        
    });
</script>

<body>
<div class="adm-wrap">
	<th:block layout:fragment="header" th:insert="~{@{/adm/layout/admheader}}"></th:block>
	
	<div layout:fragment="content">
    <div class="adm-container">
        <header>
            <ul class="top-info">
                <li>
                    <i class="iconfont">account_circle</i><span th:text="${sessInfo.CrbnAdmNm}">홍길동님</span> 님 반갑습니다
                </li>
                <li>
                    <a href="#"><i class="iconfontline">logout</i>로그아웃</a>
                </li>
            </ul>
        </header>

        <!--- content -->
        <div class="adm-content">
            <h2>기관 핫 뉴스</h2>

            <div class="grid-2">
                <!--<div class="t-13 mT10 gray">총 건수 : 300건</div>-->
				<div class="t-13 mT10 gray">
				    <!--총 건수 : <span id="totalCount">0</span>건-->
				    총 건수 : <span th:text="${totalCount}">0</span> 건
				</div>
                <div class="t-right">
                    <div class="search-type">
                        <!--<input type="text" name="" id="" class="input-type1" placeholder="Search" />
                        <button type="button" class="btn-search">검색</button>-->
						<!-- 검색 입력란과 버튼에 id, name 추가 -->
						<input type="text" name="searchValue" id="searchValue" class="input-type1" placeholder="Search" />
						<button type="button" class="btn-search" id="searchBtn">검색</button>						
						
                    </div>
                </div>
            </div>

            <div class="board-type1 mT10">
                <table>
                    <colgroup>
                        <col />
                        <col style="width:40%;" />
                        <col style="width:15%;" />
                        <col style="width:15%;" />
                        <col style="width:10%;" />
                    </colgroup>
                    <thead>
                        <tr>
			              <th>제목</th>
			              <th>문서 출처</th>
			              <th>상태</th>
			              <th>변경일</th>
                        </tr>
                    </thead>
                    <!--<tbody>-->
                    <tbody id="boardTbody1">
			            <tr th:each="docdesc : ${ntsList}">
			                <td > <a th:href="@{'/adm/content/HotNewsDesc.do?docSeq=' + ${docdesc.docSeq}}" th:text="${docdesc.docTitle}"></a>
			                </td>
			                <td th:text="${ docdesc.docFrom }"></td>
			                <td th:if="${docdesc.docStat == 'N'}">등록</td>
			                <td th:if="${docdesc.docStat == 'V'}">게시</td>
			                <td th:if="${docdesc.docStat == 'C'}">게시취소</td>
			                <td th:if="${docdesc.docStat == 'D'}">삭제</td>
			                <td th:text="${ docdesc.regDtm }"></td>
			            </tr>

                    </tbody>
                </table>
            </div>

            <div class="f-right mT20">
                <button type="button" class="btn-blue" id="insertBtn">등록</button>
            </div>

            <!-- page number -->
            <!--// page number -->
			

			<!-- 페이징 UI 시작 -->
			<div class="page-num mT30" th:if="${totalPages > 1}">
			    <div class="inner">
			        <ul>
			            <!-- 처음 페이지로 이동 -->
			            <li>
			                <a th:href="@{|?page=1|}" th:classappend="${currentPage == 1} ? 'disabled'">
			                    <i class="iconfont">first_page</i>
			                </a>
			            </li>
			            <!-- 이전 페이지로 이동 -->
			            <li>
			                <a th:href="@{|?page=${currentPage - 1}|}" th:classappend="${currentPage == 1} ? 'disabled'">
			                    <i class="iconfont">chevron_left</i>
			                </a>
			            </li>
			            <!-- 페이지 번호 반복 -->
			            <li th:each="pageNum : ${#numbers.sequence(
			                    (currentPage-4 > 0 ? currentPage-4 : 1),
			                    (currentPage+4 <= totalPages ? currentPage+4 : totalPages))}">
			                <a th:href="@{|?page=${pageNum}|}" th:text="${pageNum}"
			                   th:classappend="${pageNum == currentPage} ? 'active'"></a>
			            </li>
			            <!-- 다음 페이지로 이동 -->
			            <li>
			                <a th:href="@{|?page=${currentPage + 1}|}" th:classappend="${currentPage == totalPages} ? 'disabled'">
			                    <i class="iconfont">chevron_right</i>
			                </a>
			            </li>
			            <!-- 마지막 페이지로 이동 -->
			            <li>
			                <a th:href="@{|?page=${totalPages}|}" th:classappend="${currentPage == totalPages} ? 'disabled'">
			                    <i class="iconfont">last_page</i>
			                </a>
			            </li>
			        </ul>
			    </div>
			</div>
			<!-- 페이징 UI 끝 -->			

        </div>
        <!---// content -->

        <footer>
            Copyright ⓒ CarbonBank. All Rights Reserved
        </footer>
    </div>

	</div>
</div><!-- //wrap -->
</body>
</html>
