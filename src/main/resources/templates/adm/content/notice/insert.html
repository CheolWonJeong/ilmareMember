      layout:decorate="~{adm/layout/admlayour}">
	<th:block layout:fragment="head" th:include="~{@{/adm/layout/admhead}}"></th:block>
<script type="text/javascript">
	$(function(){ 
	});

	$(document).ready(function(){
    	
		//조회버튼 클릭
        $('#docSave').on('click', function(event) {
        	
            var param = {
                     "docTitle" : $('#doc_title').val() 
                     , "docInfo" : $('#doc_info').val() 
               };        
            
            $.ajax({
                url : '/adm/content/NoticeInsProc'
                , type : 'POST'
                , dataType : 'JSON'
                , cache : false
                , data : param
                , beforeSend : function( xhr, settings ) { 
                    //loadingbar_show(); 
                }
                , success : function(data, stauts, request) {
    				if (data.procInd == "S") {
    					alert("정상 처리 되었습니다.");
    					location.href = "/adm/content/NoticeMainList.do";
    				} else {
    					alert("처리중 오류가 발생 했습니다.");
    				}

                }
                , error : function(xhr, status) {
                    alert('서비스 장애발생 관리자에게 문의해 주십시요');
                }
                , complete : function(xhr, status) {
                    //loadingbar_hide();
                }    
            });
        });
        
    });
</script>
